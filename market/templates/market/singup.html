{% extends 'market/base.html' %}
{% block content %}
    <div class="w-1/2 my-6 mx-auto p-6 bg-gray-100 rounded-xl">
        <h2 class="text-2xl font-bold mb-4">Sign Up</h2>
        <form action="{% url 'singup' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="inline-block mb-2" for="username">Username:</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="inline-block mb-2" for="email">Email:</label>
                {{ form.email }}
            </div>
            <div class="mb-3">
                <label class="inline-block mb-2"   for="password1">Password:</label>
                {{ form.password1 }}
            </div>
            <div class="mb-3">
                <label for="password2">Confirm Password:</label>
                {{ form.password2 }}
            </div>
            <button type="submit" class="bg-teal-500 text-white py-2 px-4 rounded hover:bg-teal-700">Sign Up</button>
        </form>
    </div>
{% endblock %}
